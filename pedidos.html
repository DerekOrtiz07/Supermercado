<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Realizados - EcoComida</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to right, #e8f5e9, #f1f8e9); /* Verde menta/claro suave */
    margin:0;
    padding:20px;
}

h1 {
    color:#1b5e20; /* Verde bosque oscuro */
    font-size:35px;
}

table {
    background:white;
    border-collapse:collapse;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0px 6px 15px rgba(0,0,0,0.15);
    transition:0.3s;
    width: 75%;
    margin: 0 auto;
}

table:hover {
    transform:scale(1.02);
}

th {
    background:#2e7d32; /* Verde corporativo Eco */
    color:white;
    padding:15px;
    font-size:18px;
}

td {
    padding:12px;
    text-align:center;
}

tr:nth-child(even) {
    background:#f9fbe7; /* Sutil toque verde/lima claro */
}

tr:hover {
    background:#c8e6c9; /* Verde pastel al pasar el cursor */
}

/* --- CLASES DE ESTADO ESTILIZADAS ESTILO DELIVERY --- */
.preparando {
    background-color: #fff3e0; /* Se mantiene naranja suave para denotar espera/proceso */
    color: #e65100;
    font-weight: bold;
    border-radius: 20px;
    padding: 6px 12px;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}

.proceso {
    background-color: #e3f2fd; /* Azul suave para distribución/camino */
    color: #0d47a1;
    font-weight: bold;
    border-radius: 20px;
    padding: 6px 12px;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}

.enviado {
    background-color: #a5d6a7; /* Verde más vivo para completado */
    color: #1b5e20;
    font-weight: bold;
    border-radius: 20px;
    padding: 6px 12px;
    display: inline-block;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}

/* Efecto feedback al pasar el mouse por encima del estado */
.preparando:hover, .proceso:hover, .enviado:hover {
    transform: scale(1.1);
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

a {
    text-decoration:none;
    background:#2e7d32; /* Verde combinando con la tabla */
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
    transition:0.3s;
}

a:hover {
    background:#1b5e20; /* Verde más oscuro al pasar el cursor */
    transform:scale(1.05);
}

@media(max-width:768px) {
    table {
        width:100%;
        font-size:12px;
    }
    h1 {
        font-size:24px;
    }
}
</style>
</head>

<body>

<center>
    <h1>📦 Pedidos Realizados</h1>
</center>

<table id="tablaPedidos" border="1" style="border: 1px solid #e0e0e0;">
    <thead>
        <tr>
            <th>N°</th>
            <th>Cliente</th>
            <th>Productos Solicitados</th>
            <th>Cantidad Total</th>
            <th>Estado (Haz Click)</th>
        </tr>
    </thead>
    <tbody>
        </tbody>
</table>

<br><br>

<center>
    <a href="index.html">⬅ Inicio</a>
</center>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const tbody = document.querySelector("#tablaPedidos tbody");

        // 1. Cargar pedidos desde la Base de Datos al abrir la página
        fetch("http://127.0.0.1:8080/api/obtener_pedidos")
            .then(response => response.json())
            .then(pedidos => {
                tbody.innerHTML = "";

                if (pedidos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5">No hay pedidos registrados actualmente.</td></tr>`;
                    return;
                }

                pedidos.forEach(pedido => {
                    const fila = document.createElement("tr");
                    
                    let claseEstado = "preparando";
                    let textoEstado = pedido.estado || "Preparando";
                    
                    if (textoEstado === "En Proceso" || textoEstado === "proceso") {
                        claseEstado = "proceso";
                        textoEstado = "En Proceso";
                    } else if (textoEstado === "Enviado" || textoEstado === "enviado") {
                        claseEstado = "enviado";
                        textoEstado = "Enviado";
                    } else {
                        textoEstado = "Preparando";
                    }

                    fila.innerHTML = `
                        <td>${pedido.id}</td>
                        <td><strong>${pedido.cliente}</strong></td>
                        <td>${pedido.productos}</td>
                        <td>${pedido.cantidad} unidades</td>
                        <td>
                            <span class="${claseEstado}" data-id="${parseInt(pedido.id)}" onclick="cambiarEstadoCelda(this)">
                                ${textoEstado}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            })
            .catch(error => {
                console.error("Error:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="color: red;">❌ Error al conectar con el servidor.</td></tr>`;
            });
    });

    // 2. Función encargada de la lógica interactiva del Click
    function cambiarEstadoCelda(elemento) {
        const pedidoId = elemento.getAttribute('data-id');
        const estadoActual = elemento.textContent.trim();
        
        let siguienteEstado = "";
        let nuevaClase = "";

        if (estadoActual === "Preparando") {
            siguienteEstado = "En Proceso";
            nuevaClase = "proceso";
        } else if (estadoActual === "En Proceso") {
            siguienteEstado = "Enviado";
            nuevaClase = "enviado";
        } else {
            siguienteEstado = "Preparando";
            nuevaClase = "preparando";
        }

        const datosCambio = {
            id: pedidoId,
            estado: siguienteEstado
        };

        fetch('http://127.0.0.1:8080/api/actualizar_estado', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datosCambio)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                elemento.textContent = siguienteEstado;
                elemento.className = nuevaClase;
            } else {
                alert('❌ Error al actualizar el estado en el servidor: ' + data.mensaje);
            }
        })
        .catch(error => {
            console.error('Error de red:', error);
            alert('❌ Error de comunicación con la base de datos.');
        });
    }
</script>

</body>
</html>

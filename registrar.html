<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);

            /* FLEXBOX */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-registro {
            width: 100%;
            padding: 20px;

            /* FLEXBOX */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta-registro {
            width: 100%;
            max-width: 520px;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            /* GRID LAYOUT */
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;

            /* ANIMACIÓN */
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .encabezado-registro {
            text-align: center;
        }

        .encabezado-registro h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .encabezado-registro p {
            color: #666;
            font-size: 15px;
        }

        .formulario-registro {
            /* GRID LAYOUT */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .grupo-input {
            display: grid;
            gap: 8px;
        }

        .grupo-input label {
            font-weight: bold;
            color: #333;
        }

        .grupo-input input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;

            /* TRANSICIÓN */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .grupo-input input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.4);
        }

        .campo-completo {
            grid-column: span 2;
        }

        .btn-registrar {
            grid-column: span 2;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background-color: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            /* TRANSICIÓN */
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-registrar:hover {
            background-color: #2a5298;
            transform: scale(1.04);
        }

        .texto-login {
            text-align: center;
            color: #555;
        }

        .texto-login a {
            color: #1e3c72;
            font-weight: bold;
            text-decoration: none;

            /* TRANSICIÓN */
            transition: color 0.3s ease;
        }

        .texto-login a:hover {
            color: #2a5298;
            text-decoration: underline;
        }

        /* RESPONSIVE CON MEDIA QUERIES */
        @media (max-width: 600px) {
            .tarjeta-registro {
                padding: 25px;
                border-radius: 14px;
            }

            .formulario-registro {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: span 1;
            }

            .btn-registrar {
                grid-column: span 1;
                font-size: 15px;
            }

            .encabezado-registro h1 {
                font-size: 26px;
            }

            .encabezado-registro p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <main class="contenedor-registro">

        <section class="tarjeta-registro">

            <div class="encabezado-registro">
                <h1>Registro de Usuario</h1>
                <p>Crea tu cuenta para acceder al sistema</p>
            </div>

            <!-- Solo HTML: sin JavaScript -->
            <form class="formulario-registro" action="login.html" method="get">

                <div class="grupo-input campo-completo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
                </div>

                <div class="grupo-input campo-completo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo electrónico" required>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                </div>

                <div class="grupo-input">
                    <label for="confirmar">Confirmar contraseña:</label>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña" required>
                </div>

                <button type="submit" class="btn-registrar">
                    Registrar
                </button>

            </form>

            <p class="texto-login">
                ¿Ya tienes cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>

        </section>

    </main>

</body>
</html>

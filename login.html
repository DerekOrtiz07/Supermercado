<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);

            /* FLEXBOX */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-login {
            width: 100%;
            padding: 20px;

            /* FLEXBOX */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta-login {
            width: 100%;
            max-width: 420px;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            /* GRID LAYOUT */
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;

            /* ANIMACIÓN */
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .encabezado-login {
            text-align: center;
        }

        .encabezado-login h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .encabezado-login p {
            color: #666;
            font-size: 15px;
        }

        .formulario-login {
            /* GRID LAYOUT */
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .grupo-input {
            display: grid;
            gap: 8px;
        }

        .grupo-input label {
            font-weight: bold;
            color: #333;
        }

        .grupo-input input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;

            /* TRANSICIÓN */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .grupo-input input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.4);
        }

        .btn-ingresar {
            padding: 13px;
            border: none;
            border-radius: 10px;
            background-color: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            /* TRANSICIÓN */
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-ingresar:hover {
            background-color: #2a5298;
            transform: scale(1.04);
        }

        .texto-registro {
            text-align: center;
            color: #555;
        }

        .texto-registro a {
            color: #1e3c72;
            font-weight: bold;
            text-decoration: none;

            /* TRANSICIÓN */
            transition: color 0.3s ease;
        }

        .texto-registro a:hover {
            color: #2a5298;
            text-decoration: underline;
        }

        /* RESPONSIVE CON MEDIA QUERIES */
        @media (max-width: 600px) {
            .tarjeta-login {
                padding: 25px;
                border-radius: 14px;
            }

            .encabezado-login h1 {
                font-size: 26px;
            }

            .encabezado-login p {
                font-size: 14px;
            }

            .btn-ingresar {
                font-size: 15px;
            }
        }
    </style>
</head>

<script>
  // Capturamos el formulario y los campos de entrada
  const formLogin = document.getElementById('formLogin');
  const inputUsuario = document.getElementById('usuario'); // Aquí se ingresa el CORREO
  const inputPassword = document.getElementById('password');

  // EVENTO: se ejecuta cuando el usuario da clic en "Ingresar"
  formLogin.addEventListener('submit', function(event) {
    event.preventDefault(); // Evita que la página se recargue

    const correo = inputUsuario.value.trim();
    const password = inputPassword.value;

    // VALIDACIÓN BÁSICA: ningún campo puede estar vacío
    if (correo === '' || password === '') {
      alert('❌ Debes completar ambos campos.');
      return;
    }

    fetch('http://127.0.0.1:8080/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo: correo, password: password })
    })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          // Credenciales correctas: avisamos que ya puede acceder
          alert('✅ Esta persona ya puede iniciar sesión. ¡Bienvenido, ' + data.nombre + '!');
          window.location.href = 'index.html';
        } else {
          // Correo/contraseña incorrectos
          alert('❌ ' + data.mensaje);
        }
      })
      .catch(error => {
        console.error('Error de conexión:', error);
        alert('❌ No se pudo conectar con el servidor.');
      });
  });
</script>
<body>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="encabezado-login">
                <h1>Iniciar Sesión</h1>
                <p>Bienvenido, ingresa tus datos para continuar</p>
            </div>

            <!-- Le quitamos action="index.html" y method="get" porque ahora 
     JavaScript se encarga de enviar los datos, no el navegador directamente -->
            <form class="formulario-login" id="formLogin">

                <div class="grupo-input">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                </div>

                <button type="submit" class="btn-ingresar">
                    Ingresar
                </button>

            </form>

            <p class="texto-registro">
                ¿No tienes cuenta?
                <a href="registrar.html">Regístrate aquí</a>
            </p>

        </section>

    </main>

</body>
</html>
